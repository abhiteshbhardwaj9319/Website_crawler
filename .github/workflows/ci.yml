name: offline-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Run offline test suite (no provider keys, no live network tests)
        run: uv run pytest -q
