<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1130" viewBox="0 0 1180 1130" role="img" aria-labelledby="title desc">
<title id="title">Proposed website-grounded RAG architecture</title><desc id="desc">Left: crawl, extract, chunk, embed, and store website evidence. Right: validate a question, retrieve, assemble context, generate, validate citations, and return an answer, insufficient evidence, or error. Usage and evaluation are measured throughout. No application code is implemented yet.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#17324d}.title{font-size:19px;font-weight:700}.body{font-size:15px;fill:#475569}.small{font-size:14px;fill:#475569}.lane{font-size:22px;font-weight:700}</style>
<rect width="1180" height="1130" fill="#f8fafc"/>
<text font-family="Arial, Helvetica, sans-serif" x="36" y="48" font-size="29" font-weight="700">Website-grounded RAG</text>
<text font-family="Arial, Helvetica, sans-serif" x="36" y="78" font-size="17" fill="#475569">One scoped website. Traceable evidence. Measured answers.</text>
<rect x="838" y="25" width="305" height="58" rx="10" fill="#fff3cd"/>
<text font-family="Arial, Helvetica, sans-serif" x="857" y="49" font-size="16" font-weight="700">PROPOSED • PLANNING ONLY</text>
<text font-family="Arial, Helvetica, sans-serif" x="857" y="70" font-size="14">Application not implemented • 26 Sep 2026</text>
<rect x="24" y="110" width="544" height="660" rx="18" fill="#eaf2f8"/>
<rect x="612" y="110" width="544" height="660" rx="18" fill="#eaf6f1"/>
<text font-family="Arial, Helvetica, sans-serif" x="52" y="147" font-size="22" font-weight="700" fill="#17324d">1. Build the knowledge base</text>
<text font-family="Arial, Helvetica, sans-serif" x="52" y="172" font-size="14" fill="#475569">Bounded ingestion • target 20–30 useful pages</text>
<text font-family="Arial, Helvetica, sans-serif" x="640" y="147" font-size="22" font-weight="700" fill="#17324d">2. Answer from indexed evidence</text>
<text font-family="Arial, Helvetica, sans-serif" x="640" y="172" font-size="14" fill="#475569">Bounded LangGraph workflow • no live web search</text><g><rect x="52" y="192" width="480" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1"/><rect x="52" y="192" width="6" height="84" rx="3" fill="#234b68"/><text font-family="Arial, Helvetica, sans-serif" x="74" y="219" font-size="19" font-weight="700" fill="#17324d">Discover and fetch</text><text font-family="Arial, Helvetica, sans-serif" x="74" y="242" font-size="15" fill="#475569">crawl.py</text><text font-family="Arial, Helvetica, sans-serif" x="74" y="262" font-size="15" fill="#475569">Allowed host/path, rate limits, URL and status log</text></g><g><rect x="640" y="192" width="480" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1"/><rect x="640" y="192" width="6" height="84" rx="3" fill="#16866c"/><text font-family="Arial, Helvetica, sans-serif" x="662" y="219" font-size="19" font-weight="700" fill="#17324d">Validate the question</text><text font-family="Arial, Helvetica, sans-serif" x="662" y="242" font-size="15" fill="#475569">cli.py → graph.py</text><text font-family="Arial, Helvetica, sans-serif" x="662" y="262" font-size="15" fill="#475569">Check input, corpus version and index readiness</text></g><path d="M292 276 V299" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M880 276 V299" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="52" y="304" width="480" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1"/><rect x="52" y="304" width="6" height="84" rx="3" fill="#234b68"/><text font-family="Arial, Helvetica, sans-serif" x="74" y="331" font-size="19" font-weight="700" fill="#17324d">Extract useful sections</text><text font-family="Arial, Helvetica, sans-serif" x="74" y="354" font-size="15" fill="#475569">extract.py</text><text font-family="Arial, Helvetica, sans-serif" x="74" y="374" font-size="15" fill="#475569">Clean text, headings, code and actual anchors</text></g><g><rect x="640" y="304" width="480" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1"/><rect x="640" y="304" width="6" height="84" rx="3" fill="#16866c"/><text font-family="Arial, Helvetica, sans-serif" x="662" y="331" font-size="19" font-weight="700" fill="#17324d">Retrieve evidence</text><text font-family="Arial, Helvetica, sans-serif" x="662" y="354" font-size="15" fill="#475569">retrieve.py</text><text font-family="Arial, Helvetica, sans-serif" x="662" y="374" font-size="15" fill="#475569">Dense baseline; hybrid only after comparison</text></g><path d="M292 388 V411" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M880 388 V411" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="52" y="416" width="480" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1"/><rect x="52" y="416" width="6" height="84" rx="3" fill="#234b68"/><text font-family="Arial, Helvetica, sans-serif" x="74" y="443" font-size="19" font-weight="700" fill="#17324d">Create traced chunks</text><text font-family="Arial, Helvetica, sans-serif" x="74" y="466" font-size="15" fill="#475569">chunk.py</text><text font-family="Arial, Helvetica, sans-serif" x="74" y="486" font-size="15" fill="#475569">Stable IDs, page URL, section and corpus version</text></g><g><rect x="640" y="416" width="480" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1"/><rect x="640" y="416" width="6" height="84" rx="3" fill="#16866c"/><text font-family="Arial, Helvetica, sans-serif" x="662" y="443" font-size="19" font-weight="700" fill="#17324d">Assemble context</text><text font-family="Arial, Helvetica, sans-serif" x="662" y="466" font-size="15" fill="#475569">Deduplicate and respect the token budget</text><text font-family="Arial, Helvetica, sans-serif" x="662" y="486" font-size="15" fill="#475569">Preserve evidence needed across multiple pages</text></g><path d="M292 500 V523" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M880 500 V523" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="52" y="528" width="480" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1"/><rect x="52" y="528" width="6" height="84" rx="3" fill="#234b68"/><text font-family="Arial, Helvetica, sans-serif" x="74" y="555" font-size="19" font-weight="700" fill="#17324d">Embed in batches</text><text font-family="Arial, Helvetica, sans-serif" x="74" y="578" font-size="15" fill="#475569">embeddings.py</text><text font-family="Arial, Helvetica, sans-serif" x="74" y="598" font-size="15" fill="#475569">Selected model, compatible dimensions, usage</text></g><g><rect x="640" y="528" width="480" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1"/><rect x="640" y="528" width="6" height="84" rx="3" fill="#16866c"/><text font-family="Arial, Helvetica, sans-serif" x="662" y="555" font-size="19" font-weight="700" fill="#17324d">Generate supported claims</text><text font-family="Arial, Helvetica, sans-serif" x="662" y="578" font-size="15" fill="#475569">generate.py • versioned runtime prompt</text><text font-family="Arial, Helvetica, sans-serif" x="662" y="598" font-size="15" fill="#475569">One normal model call; abstain if unsupported</text></g><path d="M292 612 V635" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M880 612 V635" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="52" y="640" width="480" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1"/><rect x="52" y="640" width="6" height="84" rx="3" fill="#234b68"/><text font-family="Arial, Helvetica, sans-serif" x="74" y="667" font-size="19" font-weight="700" fill="#17324d">Persist the corpus</text><text font-family="Arial, Helvetica, sans-serif" x="74" y="690" font-size="15" fill="#475569">index.py • Qdrant + local manifest</text><text font-family="Arial, Helvetica, sans-serif" x="74" y="710" font-size="15" fill="#475569">Vectors and source metadata; reload verification</text></g><g><rect x="640" y="640" width="480" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1"/><rect x="640" y="640" width="6" height="84" rx="3" fill="#16866c"/><text font-family="Arial, Helvetica, sans-serif" x="662" y="667" font-size="19" font-weight="700" fill="#17324d">Validate and render citations</text><text font-family="Arial, Helvetica, sans-serif" x="662" y="690" font-size="15" fill="#475569">citations.py</text><text font-family="Arial, Helvetica, sans-serif" x="662" y="710" font-size="15" fill="#475569">Check IDs/quotes; derive URLs from metadata</text></g><path d="M532 682 H590 V346 H637" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text font-family="Arial, Helvetica, sans-serif" x="581" y="530" transform="rotate(-90 581 530)" font-size="14" fill="#475569">Read the completed index</text><path d="M880 724 V799" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="804" width="1132" height="100" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text font-family="Arial, Helvetica, sans-serif" x="48" y="833" font-size="19" font-weight="700" fill="#17324d">Three explicit outcomes</text>
<text font-family="Arial, Helvetica, sans-serif" x="48" y="864" font-size="15" fill="#475569">Answer + supporting sources</text>
<text font-family="Arial, Helvetica, sans-serif" x="425" y="864" font-size="15" fill="#475569">Insufficient indexed evidence</text>
<text font-family="Arial, Helvetica, sans-serif" x="850" y="864" font-size="15" fill="#475569">Operational / validation error</text>
<text font-family="Arial, Helvetica, sans-serif" x="48" y="887" font-size="14" fill="#475569">A valid citation is necessary; evaluation must still check whether it supports the claim.</text>
<rect x="24" y="932" width="544" height="128" rx="14" fill="#eaf2f8"/>
<text font-family="Arial, Helvetica, sans-serif" x="48" y="962" font-size="19" font-weight="700" fill="#17324d">Usage accounting across all calls</text>
<text font-family="Arial, Helvetica, sans-serif" x="48" y="990" font-size="15" fill="#475569">Ingestion + query embeddings + generation + retries</text>
<text font-family="Arial, Helvetica, sans-serif" x="48" y="1014" font-size="15" fill="#475569">Measured / estimated labels and dated provider prices</text>
<text font-family="Arial, Helvetica, sans-serif" x="48" y="1038" font-size="15" fill="#475569">Example query; 100 / 1,000 / 10,000 query projections</text>
<rect x="612" y="932" width="544" height="128" rx="14" fill="#eaf6f1"/>
<text font-family="Arial, Helvetica, sans-serif" x="636" y="962" font-size="19" font-weight="700" fill="#17324d">Frozen evaluation, reviewed evidence</text>
<text font-family="Arial, Helvetica, sans-serif" x="636" y="990" font-size="15" fill="#475569">15 questions • 5 categories • separate development set</text>
<text font-family="Arial, Helvetica, sans-serif" x="636" y="1014" font-size="15" fill="#475569">Retrieval coverage, claim support, citations, abstention</text>
<text font-family="Arial, Helvetica, sans-serif" x="636" y="1038" font-size="15" fill="#475569">Actual failures, latency, usage and configuration versions</text>
<text font-family="Arial, Helvetica, sans-serif" x="36" y="1100" font-size="14" fill="#475569">All module locations are proposed. Website, provider, model IDs and budget remain pending.</text></svg>
