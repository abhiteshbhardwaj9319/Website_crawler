<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Website-grounded RAG architecture (implemented)</title>
<desc id="desc">Left: per-site ingestion from the CLI through the site registry, crawler, extractor, chunker and local embeddings. Middle: isolated per-site corpora, each with a Qdrant collection, a BM25 index and a manifest; a query opens exactly one. Right: the LangGraph query workflow: validate, hybrid retrieval, context selection, generation with OpenAI and one visible Groq fallback, citation checks, and finalize into an answer, insufficient evidence, or an error. Bottom: local traces, usage ledger, run records and evaluation.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17324d}
.h{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#475569}
.lane{font-size:17px;font-weight:700;fill:#334155}
.t{font-size:14px;font-weight:700}.b{font-size:12.5px;fill:#475569}
.box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.2}
.ing{fill:#eef6ff;stroke:#7aa7d9;stroke-width:1.2}
.q{fill:#eefbf3;stroke:#6bbf8a;stroke-width:1.2}
.site{fill:#fffdf4;stroke:#caa53d;stroke-width:1.2}
.obs{fill:#f5f3ff;stroke:#a595e6;stroke-width:1.2}
.ln{stroke:#64748b;stroke-width:1.5;fill:none}
.lr{stroke:#b45309;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
</style>
<rect width="1200" height="860" fill="#f8fafc"/>
<text class="h" x="30" y="42">Website-grounded RAG</text>
<text class="sub" x="30" y="66">Numbered websites, one isolated corpus per site, answers only from the selected site's cited evidence.</text>

<text class="lane" x="30" y="104">Ingestion (per site)</text>
<rect class="ing" x="30" y="116" width="330" height="54" rx="8"/><text class="t" x="44" y="138">CLI: rag sites add / rag ingest --site N</text><text class="b" x="44" y="157">progress, counts, skip reasons, run id</text>
<rect class="ing" x="30" y="190" width="330" height="54" rx="8"/><text class="t" x="44" y="212">Site registry (registry.py)</text><text class="b" x="44" y="231">stable numbers, default 1, scope, active corpus</text>
<rect class="ing" x="30" y="264" width="330" height="68" rx="8"/><text class="t" x="44" y="286">Bounded crawler (crawl.py, urls.py)</text><text class="b" x="44" y="305">robots.txt, host+path scope, redirect checks,</text><text class="b" x="44" y="321">private-IP block, page/depth/byte/time/rate caps</text>
<rect class="ing" x="30" y="352" width="330" height="54" rx="8"/><text class="t" x="44" y="374">Extractor (extract.py)</text><text class="b" x="44" y="393">headings, real anchors, code, lists, tables</text>
<rect class="ing" x="30" y="426" width="330" height="54" rx="8"/><text class="t" x="44" y="448">Section-aware chunker (chunk.py)</text><text class="b" x="44" y="467">~320 tokens, stable chunk IDs, provenance</text>
<rect class="ing" x="30" y="500" width="330" height="54" rx="8"/><text class="t" x="44" y="522">Local embeddings (embeddings.py)</text><text class="b" x="44" y="541">BAAI/bge-small-en-v1.5, ONNX, no API cost</text>
<path class="ln" d="M195 170V188M195 244V262M195 332V350M195 406V424M195 480V498" marker-end="url(#a)"/>

<text class="lane" x="410" y="104">Isolated corpora (index.py)</text>
<rect x="398" y="116" width="344" height="236" rx="10" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/>
<text class="b" x="410" y="136" style="fill:#0f766e;font-weight:700">Selected-site boundary: a query opens exactly one</text>
<rect class="site" x="412" y="146" width="316" height="192" rx="8"/>
<text class="t" x="426" y="170">Site 1  Scrapy 2.19 docs (45 pages)</text>
<rect class="box" x="426" y="182" width="288" height="40" rx="6"/><text class="b" x="438" y="206">Qdrant collection corpus_&lt;corpus_id&gt; (dense)</text>
<rect class="box" x="426" y="230" width="288" height="40" rx="6"/><text class="b" x="438" y="254">chunks.jsonl + BM25 (lexical)</text>
<rect class="box" x="426" y="278" width="288" height="44" rx="6"/><text class="b" x="438" y="297">manifest: complete/building, embedding</text><text class="b" x="438" y="313">model + config fingerprint</text>
<rect class="site" x="412" y="372" width="316" height="96" rx="8"/>
<text class="t" x="426" y="396">Site 2  Python 3.13 tutorial (17 pages)</text>
<text class="b" x="426" y="418">own collection, BM25 index and manifest</text>
<text class="b" x="426" y="438">never searched while site 1 is selected</text>
<text class="b" x="426" y="458">Site N: added from a URL during a demo</text>
<path class="ln" d="M360 527C385 527 385 250 410 250" marker-end="url(#a)"/>
<text class="b" x="412" y="498">Refresh builds a new corpus beside the active one;</text>
<text class="b" x="412" y="516">the registry switches only after it is complete.</text>

<text class="lane" x="790" y="104">Query workflow (graph.py, LangGraph)</text>
<rect class="q" x="790" y="116" width="380" height="46" rx="8"/><text class="t" x="804" y="137">rag ask "..." --site N  |  rag chat</text><text class="b" x="804" y="154">--provider openai|groq|auto, --mode, --json</text>
<rect class="q" x="790" y="180" width="380" height="46" rx="8"/><text class="t" x="804" y="201">validate</text><text class="b" x="870" y="201">question, site ready, manifest, model match</text>
<rect class="q" x="790" y="244" width="380" height="46" rx="8"/><text class="t" x="804" y="265">retrieve</text><text class="b" x="870" y="265">dense + BM25, RRF fusion (default hybrid)</text><text class="b" x="870" y="281">every payload re-checked for site/corpus</text>
<rect class="q" x="790" y="308" width="380" height="46" rx="8"/><text class="t" x="804" y="329">context</text><text class="b" x="870" y="329">top 10 chunks within a 3,000-token budget</text>
<rect class="q" x="790" y="372" width="380" height="60" rx="8"/><text class="t" x="804" y="393">generate</text><text class="b" x="870" y="393">LangChain ChatOpenAI / ChatGroq, strict JSON</text><text class="b" x="870" y="409">schema: claims + chunk IDs + verbatim quotes</text><text class="b" x="870" y="425">gpt-4.1-mini, one visible fallback to gpt-oss-120b</text>
<rect class="q" x="790" y="450" width="380" height="46" rx="8"/><text class="t" x="804" y="471">check citations</text><text class="b" x="920" y="471">IDs in context, quotes found,</text><text class="b" x="920" y="487">URLs from index metadata only</text>
<rect class="q" x="790" y="514" width="380" height="60" rx="8"/><text class="t" x="804" y="535">finalize</text><text class="b" x="870" y="535">answered | partially_answered |</text><text class="b" x="870" y="551">insufficient_evidence | error (typed code + hint)</text><text class="b" x="870" y="567">usage totals, latency, run record</text>
<path class="ln" d="M980 162V178M980 226V242M980 290V306M980 354V370M980 432V448M980 496V512" marker-end="url(#a)"/>
<path class="ln" d="M742 250C765 250 765 267 788 267" marker-end="url(#a)"/>
<path class="lr" d="M1170 331C1190 331 1190 540 1172 540" marker-end="url(#r)"/>
<text class="b" x="1188" y="600" text-anchor="end" style="fill:#b45309">no evidence: abstain</text>
<text class="b" x="1188" y="616" text-anchor="end" style="fill:#b45309">without a model call</text>
<path class="lr" d="M790 203C765 203 765 545 788 545" marker-end="url(#r)"/>
<text class="b" x="752" y="600" style="fill:#b45309">any stage error:</text>
<text class="b" x="752" y="616" style="fill:#b45309">explicit error path</text>

<text class="lane" x="30" y="668">Observability and evidence</text>
<rect class="obs" x="30" y="680" width="360" height="72" rx="8"/><text class="t" x="44" y="702">Local traces (tracing.py)</text><text class="b" x="44" y="721">JSONL spans: run/span/parent IDs, site, corpus, ranks,</text><text class="b" x="44" y="737">provider attempts, errors; secrets redacted; rag trace</text>
<rect class="obs" x="410" y="680" width="360" height="72" rx="8"/><text class="t" x="424" y="702">Usage ledger (usage.py)</text><text class="b" x="424" y="721">one event per call attempt; provider-reported tokens;</text><text class="b" x="424" y="737">dated prices; unknown cost stays unknown; rag costs</text>
<rect class="obs" x="790" y="680" width="380" height="72" rx="8"/><text class="t" x="804" y="702">Evaluation (evaluate.py, eval/)</text><text class="b" x="804" y="721">frozen test/dev/isolation labels; Recall@k, context</text><text class="b" x="804" y="737">recall, abstention, citation validity, leakage</text>
<path class="ln" d="M980 574V678" marker-end="url(#a)"/>
<text class="b" x="30" y="800">Scores (cosine, BM25, RRF, cross-encoder) rank passages; none is treated as a calibrated confidence. A valid citation proves the</text>
<text class="b" x="30" y="818">quoted passage was supplied, not that it entails the claim; semantic support is reviewed in evaluation.</text>
</svg>
